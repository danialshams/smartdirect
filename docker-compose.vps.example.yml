# Future self-hosting reference. Not deployed by Vercel or used on localhost.
# Copy .env.vps.example to .env.vps and replace all placeholders before use.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env.vps
        required: false
    environment:
      EXECUTION_BACKEND: worker
      REDIS_DRIVER: redis
      REDIS_URL: redis://redis:6379
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - path: .env.vps
        required: false
    environment:
      EXECUTION_BACKEND: worker
      REDIS_DRIVER: redis
      REDIS_URL: redis://redis:6379
      QUEUE_WORKER_CONCURRENCY: "${QUEUE_WORKER_CONCURRENCY:-4}"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
