name: WebKit mobile glass frame audit

on:
  push:
    branches:
      - fix/liquid-glass-live-frame-safari-20261101
      - fix/header-edge-band-20261101
      - fix/landing-scroll-gsap-hero-20261101
      - fix/gsap-unified-scroll-glass-20261101
      - fix/landing-performance-optics-20261101
      - fix/landing-webgl-capture-stability-20261101

  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  webkit-mobile:
    if: github.event_name == 'push' || github.head_ref == 'fix/daira-directional-card-gsap-once-20261101' || github.head_ref == 'fix/daira-card-real-surface-sticker-hero-20261101'
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(github.event_name == 'pull_request' && '["candidate", "master"]' || '["candidate"]') }}
    # Playwright WebKit currently does not ship binaries for Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: smartdirect
        ports: ["5432:5432"]
    env:
      NODE_ENV: production
      VERCEL: "1"
      VERCEL_ENV: production
      NEXTAUTH_URL: http://127.0.0.1:3198
      NEXTAUTH_SECRET: ci-only-placeholder-secret-with-more-than-32-characters
      CRON_SECRET: ci-only-placeholder-cron-secret-with-more-than-32-characters
      DATABASE_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
      DIRECT_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
      REDIS_DRIVER: redis
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source == 'master' && 'master' || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install from lockfile
        env:
          NODE_ENV: development
        run: npm ci --no-audit --no-fund
      - name: Install browser-only WebKit test dependencies
        env:
          NODE_ENV: development
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps webkit
      - name: Build real landing code
        run: npm run build
      - name: Record actual WebKit mobile scene while scrolling 75 animation frames
        run: node scripts/test-landing-webkit-scroll.mjs
      - name: Archive Safari optical comparison and frame timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daira-webkit-optics-${{ github.sha }}-${{ matrix.source }}
          path: artifacts/landing-webkit/
          if-no-files-found: ignore
          retention-days: 7
