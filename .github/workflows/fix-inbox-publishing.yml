name: Fix inbox and publishing keyword inputs

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          inbox = Path('components/dashboard/InstagramInbox.tsx')
          s = inbox.read_text(encoding='utf-8')
          s = re.sub(r'`/ api / instagram / inbox \? accountId = \$\{', ' `/api/instagram/inbox?accountId=${', s)
          s = s.replace('`/ api / instagram / inbox ? accountId = ${', '`/api/instagram/inbox?accountId=${')
          s = s.replace('}& conversationId=${', '}&conversationId=${')
          inbox.write_text(s, encoding='utf-8')

          pub = Path('components/dashboard/publishing/PublishingDashboard.tsx')
          s = pub.read_text(encoding='utf-8')
          component = '''\nfunction KeywordChipsInput({ value, onChange, placeholder }: { value: string; onChange: (value: string) => void; placeholder: string }) {\n  const keywords = value.split(/[\\n,،;؛]+/).map((item) => item.trim()).filter(Boolean).filter((item, index, list) => list.indexOf(item) === index);\n  const [draft, setDraft] = useState(\"\");\n  const sync = (next: string[]) => onChange(next.map((item) => item.trim()).filter(Boolean).filter((item, index, list) => list.indexOf(item) === index).join(\",\"));\n  const add = () => { const item = draft.trim(); if (!item) return; sync([...keywords, item]); setDraft(\"\"); };\n  return <div className=\"flex min-h-[52px] flex-wrap items-center gap-2 rounded-xl border border-slate-200 bg-white px-3 py-2 focus-within:border-slate-400\">\n    {keywords.map((item) => <span key={item} className=\"inline-flex items-center gap-1 rounded-full bg-slate-100 px-3 py-1.5 text-xs font-medium text-slate-700\">{item}<button type=\"button\" onClick={() => sync(keywords.filter((keyword) => keyword !== item))} className=\"text-slate-400 hover:text-slate-900\" aria-label={`حذف ${item}`}><X size={13} /></button></span>)}\n    <input value={draft} onChange={(event) => setDraft(event.target.value)} onKeyDown={(event) => { if ([\"Enter\", \",\", \"،\"].includes(event.key)) { event.preventDefault(); add(); } }} onBlur={add} placeholder={keywords.length ? \"کلمه بعدی...\" : placeholder} className=\"min-w-[140px] flex-1 border-0 bg-transparent px-1 py-1 text-sm outline-none\" />\n    <button type=\"button\" onClick={add} className=\"shrink-0 rounded-lg border border-slate-200 px-2.5 py-1.5 text-xs font-medium text-slate-600 hover:bg-slate-50\">افزودن کلمه</button>\n  </div>;\n}\n'''
          if 'function KeywordChipsInput(' not in s:
            marker = '\nexport default function PublishingDashboard()'
            if marker not in s: raise SystemExit('PublishingDashboard marker not found')
            s = s.replace(marker, component + marker, 1)
          for state, setter in [('commentTriggerKeywords','setCommentTriggerKeywords'), ('storyReplyTriggerKeywords','setStoryReplyTriggerKeywords')]:
            pattern = re.compile(r'<input(?:(?!/>).)*value=\{' + state + r'\}(?:(?!/>).)*/>', re.S)
            replacement = f'<KeywordChipsInput value={{{state}}} onChange={{{setter}}} placeholder="مثلاً 1، یک یا one" />'
            s, n = pattern.subn(replacement, s, count=1)
            if n != 1: raise SystemExit(f'Could not replace {state}: {n}')
          pub.write_text(s, encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -n 'api/instagram/inbox' components/dashboard/InstagramInbox.tsx
          grep -n 'KeywordChipsInput' components/dashboard/publishing/PublishingDashboard.tsx
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/dashboard/InstagramInbox.tsx components/dashboard/publishing/PublishingDashboard.tsx
          git commit -m 'fix inbox API URL and publishing keyword chips'
          git push origin master
          git rm .github/workflows/fix-inbox-publishing.yml
          git commit -m 'remove temporary fix workflow'
          git push origin master
