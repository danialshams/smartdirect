name: Fix Inbox Reply Final

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Inbox reply handling
        run: |
          python - <<'PY'
          from pathlib import Path

          route = Path('app/api/instagram/inbox/route.ts')
          s = route.read_text(encoding='utf-8')

          old = '''      if (!replyTarget.igMessageId) {
        return jsonError(
          "این پیام شناسه Instagram ندارد و امکان Reply مستقیم به آن وجود ندارد.",
          400,
        );
      }

      replyInstagramMessageId = replyTarget.igMessageId;
'''
          new = '''      if (replyTarget.direction !== "INBOUND") {
        return jsonError(
          "Reply فقط برای پیام‌های دریافتی مشتری قابل استفاده است.",
          400,
        );
      }

      if (!replyTarget.igMessageId) {
        return jsonError(
          "این پیام شناسه Instagram ندارد و امکان Reply مستقیم به آن وجود ندارد.",
          400,
        );
      }

      replyInstagramMessageId = replyTarget.igMessageId;
'''
          if old not in s:
              raise SystemExit('route target block not found')
          s = s.replace(old, new, 1)

          start_marker = '''    /*
     * The reply wrapper is optional. If Meta rejects reply_to,
     * retry once as a normal DM so selecting Reply never blocks
     * the actual message from being delivered.
     */
'''
          if start_marker not in s:
              raise SystemExit('reply fallback marker not found')
          start = s.index(start_marker)
          end = s.index('    if (!response.ok) {', start)
          s = s[:start] + s[end:]
          route.write_text(s, encoding='utf-8')

          ui = Path('components/dashboard/InstagramInbox.tsx')
          u = ui.read_text(encoding='utf-8')

          old_button = '''<button type="button" onClick={() => { if (!message.igMessageId) { setError("این پیام شناسه Instagram ندارد و امکان Reply به آن وجود ندارد."); return; } setReplyTo(message); setError(""); }} className={`absolute -top-2 rounded-full border border-slate-200 bg-white p-1.5 text-slate-500 opacity-0 shadow-sm transition group-hover:opacity-100 ${outbound ? "-left-9" : "-right-9"}`} title="Reply"><Reply size={13} /></button>'''
          new_button = '''{!outbound && <button type="button" onClick={() => { if (!message.igMessageId) { setError("این پیام شناسه Instagram ندارد و امکان Reply به آن وجود ندارد."); return; } setReplyTo(message); setError(""); }} className="absolute -top-2 -right-9 rounded-full border border-slate-200 bg-white p-1.5 text-slate-500 opacity-0 shadow-sm transition group-hover:opacity-100" title="Reply"><Reply size={13} /></button>}'''
          if old_button not in u:
              raise SystemExit('reply button block not found')
          u = u.replace(old_button, new_button, 1)

          old_header = '''<div className="flex items-center gap-2 text-[10px] font-semibold text-slate-500"><Reply size={12} />پاسخ به {replyTo.direction === "OUTBOUND" ? "پیام شما" : displayName(selectedConversation)}</div>'''
          new_header = '''<div className="flex items-center gap-2 text-[10px] font-semibold text-slate-500"><Reply size={12} />پاسخ به {displayName(selectedConversation)}</div>'''
          if old_header not in u:
              raise SystemExit('reply header block not found')
          u = u.replace(old_header, new_header, 1)

          ui.write_text(u, encoding='utf-8')
          PY

      - name: Verify changes
        run: |
          grep -q 'Reply فقط برای پیام‌های دریافتی مشتری' app/api/instagram/inbox/route.ts
          ! grep -q 'retrying as a normal DM' app/api/instagram/inbox/route.ts
          grep -q '!outbound && <button' components/dashboard/InstagramInbox.tsx

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/instagram/inbox/route.ts components/dashboard/InstagramInbox.tsx
          git commit -m "fix: validate inbox reply targets and remove fallback" || true
          git push origin master

      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-inbox-reply-final.yml || true
          git commit -m "chore: remove temporary inbox reply workflow" || true
          git push origin master || true
