name: Next.js build

on:
  pull_request:
    branches: [master]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "src/**"
      - "scripts/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - ".github/workflows/**"
  push:
    branches: [master, feature/daira-simple-home-20261029]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "src/**"
      - "scripts/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "tsconfig.json"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: next-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: smartdirect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d smartdirect"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exactly from lockfile
        run: npm ci --no-audit --no-fund

      - name: Verify the single canonical Daira color palette
        run: npm run theme:check

      - name: Verify dashboard performance and atomic save invariants
        run: npx tsx scripts/test-dashboard-performance.ts

      - name: Verify dashboard route isolation and benchmark syntax
        run: |
          npx tsx scripts/test-dashboard-route-isolation.ts
          node --check scripts/benchmark-dashboard-navigation.mjs
          node --check scripts/benchmark-dashboard-diagnostics.mjs
          node --check scripts/report-dashboard-initial-js.mjs

      - name: Test scoped home revisit cache and full coverage benchmark syntax
        run: |
          npx tsx scripts/test-dashboard-home-revisit.ts
          node --check scripts/benchmark-dashboard-revisits.mjs
          node --check scripts/report-dashboard-performance-coverage.mjs

      - name: Verify comprehensive dashboard performance and all-route audit
        run: |
          npx tsx scripts/test-dashboard-comprehensive-performance.ts
          node --check scripts/benchmark-full-dashboard.mjs

      - name: Test account-scoped list revisits and coalesced reads
        run: npx tsx scripts/test-dashboard-list-revisit.ts

      - name: Test complete Daira design system
        run: npx tsx scripts/test-daira-design-system.ts

      - name: Test cross-module Daira Liquid Glass coverage
        run: npx tsx scripts/test-daira-glass-coverage.ts

      - name: Verify dashboard create-action alignment, glass cards and safe build parity
        run: npx tsx scripts/test-dashboard-create-actions-glass.ts

      - name: Verify dashboard home badge placement and RTL icon order
        run: npx tsx scripts/test-dashboard-home-badges.ts

      - name: Verify mobile admin, subscription access and realtime ticket notifications
        run: npx tsx scripts/test-admin-panel.ts

      - name: Validate consistent admin layouts, modal portals, buttons and semantic colors
        run: npx tsx scripts/test-admin-visual-consistency.ts

      - name: Test official Meta changelog monitoring, version alerts and Persian badges
        run: npx tsx scripts/test-meta-monitor.ts

      - name: Test saved media durability and Meta ID fallback
        run: npx tsx scripts/test-saved-response-durability.ts

      - name: Test comment reply variants and RTL support actions
        run: npx tsx scripts/test-comment-reply-variants.ts

      - name: Verify reusable reply scope, naming and regression coverage
        run: npx tsx scripts/test-reusable-response-scopes.ts

      - name: Verify public Daira homepage scene and navigation contracts
        run: npx tsx scripts/test-public-landing.ts

      - name: Build application
        env:
          NODE_ENV: production
          VERCEL: "1"
          VERCEL_ENV: production
          NEXTAUTH_URL: https://example.invalid
          NEXTAUTH_SECRET: ci-only-placeholder-secret-with-more-than-32-characters
          CRON_SECRET: ci-only-placeholder-cron-secret-with-more-than-32-characters
          DATABASE_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
          DIRECT_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
          REDIS_DRIVER: redis
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run build

      - name: Report estimated initial dashboard JavaScript sizes
        run: node scripts/report-dashboard-initial-js.mjs

      - name: Inventory dashboard routes and API action coverage
        run: node scripts/report-dashboard-performance-coverage.mjs

      - name: Upload read-only JavaScript inventory
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-javascript-inventory
          path: performance-results/dashboard-initial-js.json
          if-no-files-found: error
          retention-days: 14

      - name: Archive dashboard performance coverage inventory
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-performance-coverage
          path: performance-results/dashboard-performance-coverage.json
          if-no-files-found: error
          retention-days: 14

      - name: Initialize isolated PostgreSQL schema and verify incremental inbox migration
        env:
          DATABASE_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
        run: |
          # Historical migrations from September contain a duplicate column
          # declaration; do not rewrite applied production migration history.
          npx prisma db push
          npx tsx scripts/test-durable-webhook-migration.ts

      - name: Test admin database pagination, effective plans, bulk selection and account access
        env:
          DATABASE_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
          DIRECT_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
        run: npx tsx scripts/test-admin-operations-db.ts

      - name: Test Meta account safety, recipient opt-out and rate guards against isolated PostgreSQL and Redis
        env:
          DATABASE_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
          DIRECT_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
          REDIS_DRIVER: redis
          REDIS_URL: redis://127.0.0.1:6379
          NODE_ENV: test
        run: npx tsx scripts/test-meta-account-safety.ts

      - name: Verify Persian automation STOP Quick Reply and manual-support separation
        env:
          DATABASE_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
          DIRECT_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
          REDIS_DRIVER: redis
          REDIS_URL: redis://127.0.0.1:6379
          NODE_ENV: test
        run: npx tsx scripts/test-automation-stop-quick-reply.ts

      - name: Benchmark isolated dashboard CRUD operation timings
        env:
          DATABASE_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
          DIRECT_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
          NODE_ENV: test
          CRUD_BENCH_SAMPLES: "20"
        run: npx tsx scripts/benchmark-dashboard-crud-latency.ts

      - name: Archive isolated CRUD operation timings
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-isolated-crud
          path: performance-results/dashboard-isolated-crud.json
          if-no-files-found: error
          retention-days: 14

      - name: Test atomic automation response creation and cross-account media references
        env:
          DATABASE_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
          DIRECT_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
          NODE_ENV: test
        run: npx tsx scripts/test-batch-automation-save.ts

      - name: Test saved response provenance and multi-account isolation in PostgreSQL
        env:
          DATABASE_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
          DIRECT_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
          NODE_ENV: test
        run: npx tsx scripts/test-saved-response-origin.ts

      - name: Test durable webhook recovery against PostgreSQL and Redis
        env:
          DATABASE_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
          DIRECT_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
          REDIS_DRIVER: redis
          REDIS_URL: redis://127.0.0.1:6379
          NODE_ENV: test
        run: |
          npx tsx scripts/test-durable-webhook-inbox.ts
          npx tsx scripts/test-meta-usage-headers.ts

      - name: Test portable execution-backend selection
        run: npx tsx scripts/test-execution-backend.ts

      - name: Verify VPS compose configuration
        run: |
          docker compose -f docker-compose.vps.example.yml config --quiet
          node -e 'const j=require("./package.json");for(const s of ["build:self-hosted","db:migrate:deploy","queue:worker"])if(!j.scripts[s])throw Error("Missing portable lifecycle "+s)'

      - name: Test portable publishing scheduler with PostgreSQL and Redis
        env:
          DATABASE_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
          DIRECT_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
          REDIS_DRIVER: redis
          REDIS_URL: redis://127.0.0.1:6379
          NODE_ENV: test
        run: npx tsx scripts/test-portable-publishing-scheduler.ts

      - name: Test authenticated Meta request gateway
        run: npx tsx scripts/test-instagram-gateway-policy.ts

      - name: Verify Meta webhook signatures
        run: npx tsx scripts/test-webhook-signature.ts

      - name: Test distributed Instagram traffic control
        env:
          REDIS_DRIVER: redis
          REDIS_URL: redis://127.0.0.1:6379
          NODE_ENV: test
        run: |
          npx tsx scripts/test-instagram-traffic-control.ts
          npx tsx scripts/test-instagram-traffic-release.ts
          npx tsx scripts/test-traffic-lease-recovery.ts
          npx tsx scripts/test-queue-ownership-regressions.ts

      - name: Test rate-limit and publishing test-process cleanup
        timeout-minutes: 3
        env:
          DATABASE_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
          DIRECT_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
          REDIS_DRIVER: redis
          REDIS_URL: redis://127.0.0.1:6379
          NODE_ENV: test
        run: |
          npx tsx scripts/test-rate-limit.ts
          npx tsx scripts/test-instagram-retry.ts
          npx tsx scripts/test-instagram-container-status-rate-limit.ts
          npx tsx scripts/test-instagram-publish-container-pressure.ts
          npx tsx scripts/test-publishing-queue.ts

      - name: Test independent Worker processes under account and conversation contention
        env:
          REDIS_DRIVER: redis
          REDIS_URL: redis://127.0.0.1:6379
          NODE_ENV: test
          QUEUE_WORKER_TEST_MODE: "1"
        run: npx tsx scripts/test-parallel-worker-processes.ts

      - name: Test Instagram Live automation validation
        run: npm run live:automation:test

      - name: Test smart reminder policy
        run: npm run reminders:test

      - name: Test direct keyword automation integration
        run: npx tsx scripts/test-direct-automation.ts

      - name: Test advanced Instagram Reel publishing options
        run: npx tsx scripts/test-reel-settings.ts

      - name: Test storage quota, JPEG normalization and Meta media limits
        env:
          DATABASE_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
          DIRECT_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
        run: npx tsx scripts/test-storage-accounting.ts

      - name: Test publishing and automation storage lifecycle
        env:
          DATABASE_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
          DIRECT_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
          STORAGE_PROVIDER: test
        run: npx tsx scripts/test-instagram-storage-lifecycle.ts

      - name: Test share and mention rules against PostgreSQL
        env:
          DATABASE_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
          DIRECT_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
        run: |
          npx tsx scripts/test-share-mention-account-isolation.ts
          npx tsx scripts/test-share-mention-compact-list.ts

      - name: Test redesigned support center, unread isolation and attachment persistence
        env:
          DATABASE_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
          DIRECT_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
          NODE_ENV: test
        run: npx tsx scripts/test-support-center.ts

      - name: Test shared posts and story mentions webhook matching
        run: npx tsx scripts/test-share-mention-interactions.ts

      - name: Test audio duration, upload size, and MP4 voice conversion
        run: npx tsx scripts/test-instagram-voice-limits.ts

      - name: Test shared dashboard upload pipeline and audio conversion
        run: npx tsx scripts/test-dashboard-upload-pipeline.ts

      - name: Test contextual Daira bottom navigation
        run: npx tsx scripts/test-dashboard-bottom-nav.ts

      - name: Test Daira publishing UX and data integrity
        run: npx tsx scripts/test-publishing-daira.ts

      - name: Test modern Instagram inbox regressions
        run: npx tsx scripts/test-inbox-modern.ts

      - name: Test redesigned direct menu
        run: npx tsx scripts/test-persistent-menu-redesign.ts

      - name: Test redesigned ice-breaker messages
        run: npx tsx scripts/test-icebreaker-redesign.ts

      - name: Test redesigned Instagram insights dashboard
        run: npx tsx scripts/test-insights-redesign.ts
