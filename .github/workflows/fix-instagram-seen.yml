name: Fix Instagram Seen Watermark

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch read receipt handler
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/api/webhooks/instagram/route.ts')
          source = path.read_text(encoding='utf-8')
          start_marker = '// =========================================================\n// Process Instagram read / seen receipt'
          end_marker = '// =========================================================\n// Process Instagram messaging events'
          start = source.find(start_marker)
          end = source.find(end_marker, start + len(start_marker))
          if start == -1 or end == -1:
              print('Read receipt markers not found; leaving existing handler unchanged.')
          else:
              helper = '''// =========================================================
// Process Instagram read / seen receipt
// =========================================================

async function processInstagramReadReceipt(
  messagingEvent: any,
  instagramAccount: InstagramAccountData,
) {
  try {
    const senderId = messagingEvent?.sender?.id;
    const read = messagingEvent?.read;
    if (!senderId || !read) return;

    const participantId = String(senderId);
    const readMid = typeof read.mid === 'string' ? read.mid : null;
    const rawWatermark = Number(read.watermark);
    const watermark = Number.isFinite(rawWatermark) && rawWatermark > 0 ? rawWatermark : null;

    const conversation = await prisma.conversation.findUnique({
      where: { instagramAccountId_participantId: { instagramAccountId: instagramAccount.id, participantId } },
      select: { id: true },
    });
    if (!conversation) return;

    const seenAt = new Date();
    let updatedCount = 0;

    if (readMid) {
      const anchor = await prisma.conversationMessage.findFirst({
        where: { conversationId: conversation.id, direction: 'OUTBOUND', igMessageId: readMid },
        select: { createdAt: true },
      });
      if (anchor) {
        updatedCount = (await prisma.conversationMessage.updateMany({
          where: { conversationId: conversation.id, direction: 'OUTBOUND', createdAt: { lte: anchor.createdAt }, seenAt: null },
          data: { seenAt },
        })).count;
      }
    }

    if (updatedCount === 0 && watermark !== null) {
      updatedCount = (await prisma.conversationMessage.updateMany({
        where: { conversationId: conversation.id, direction: 'OUTBOUND', createdAt: { lte: new Date(watermark) }, seenAt: null },
        data: { seenAt },
      })).count;
    }

    console.log('Instagram seen receipt processed:', { participantId, readMid, watermark, updatedCount });
  } catch (error) {
    console.error('Error processing Instagram read receipt:', error);
  }
}

'''
              source = source[:start] + helper + source[end:]
              path.write_text(source, encoding='utf-8')
          PY

      - name: Patch Automation keyword chips
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('components/dashboard/AutomationForm.tsx')
          source = path.read_text(encoding='utf-8')
          pattern = re.compile(r'function KeywordInput\([\s\S]*?\n\}\n\n/\* -------------------------------------------------------------------------- \*/\n/\* Local Helpers', re.M)
          replacement = '''function KeywordInput({
              keyword,
              setKeyword,
              description,
          }: {
              keyword: string;
              setKeyword: (value: string) => void;
              description: string;
          }) {
              const keywords = keyword.split(/[\\n,،;؛]+/).map((item) => item.trim()).filter(Boolean).filter((item, index, list) => list.indexOf(item) === index);
              const [draft, setDraft] = useState("");
              function sync(next: string[]) { setKeyword(next.join(",")); }
              function addKeyword() {
                  const value = draft.trim();
                  if (!value) return;
                  sync([...keywords, value].filter((item, index, list) => list.indexOf(item) === index));
                  setDraft("");
              }
              function removeKeyword(value: string) { sync(keywords.filter((item) => item !== value)); }
              return (
                  <div>
                      <label className="mb-2 block text-sm font-medium text-gray-800">کلمات کلیدی Trigger</label>
                      <div className="flex min-h-[52px] flex-wrap items-center gap-2 rounded-xl border border-gray-200 px-3 py-2 transition focus-within:border-gray-900">
                          {keywords.map((item) => (
                              <span key={item} className="inline-flex items-center gap-1 rounded-full bg-gray-100 px-3 py-1.5 text-xs font-medium text-gray-700">
                                  {item}
                                  <button type="button" onClick={() => removeKeyword(item)} className="text-gray-400 hover:text-gray-900" aria-label={`حذف ${item}`}><X size={13} /></button>
                              </span>
                          ))}
                          <input value={draft} onChange={(event) => setDraft(event.target.value)} onKeyDown={(event) => { if (event.key === "Enter" || event.key === "," || event.key === "،") { event.preventDefault(); addKeyword(); } }} onBlur={addKeyword} placeholder={keywords.length ? "کلمه بعدی..." : "مثلاً 1 یا یک"} className="min-w-[140px] flex-1 border-0 bg-transparent px-1 py-1 text-sm outline-none" />
                          <button type="button" onClick={addKeyword} className="inline-flex shrink-0 items-center gap-1 rounded-lg border border-gray-200 px-2.5 py-1.5 text-xs font-medium text-gray-600 hover:bg-gray-50"><Plus size={13} /> افزودن</button>
                      </div>
                      <p className="mt-2 text-xs leading-5 text-gray-400">{description} چند کلمه را با Enter یا «افزودن» اضافه کنید.</p>
                  </div>
              );
          }

/* -------------------------------------------------------------------------- */
/* Local Helpers'''
          updated, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit('AutomationForm KeywordInput block not found')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Patch Publishing dashboard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/dashboard/publishing/PublishingDashboard.tsx')
          source = path.read_text(encoding='utf-8')
          def replace_once(old, new):
              global source
              count = source.count(old)
              if count != 1: raise SystemExit(f'Expected one match: {old[:100]} ({count})')
              source = source.replace(old, new)

          replace_once(
              'const [commentAutomationId, setCommentAutomationId] = useState(""); const [storyReplyAutomationId, setStoryReplyAutomationId] = useState("");',
              'const [commentAutomationId, setCommentAutomationId] = useState(""); const [storyReplyAutomationId, setStoryReplyAutomationId] = useState(""); const [commentTriggerKeywords, setCommentTriggerKeywords] = useState(""); const [commentTriggerResponse, setCommentTriggerResponse] = useState(""); const [storyReplyTriggerKeywords, setStoryReplyTriggerKeywords] = useState(""); const [storyReplyTriggerResponse, setStoryReplyTriggerResponse] = useState("");')
          replace_once(
              'setCommentAutomationId(""); setStoryReplyAutomationId(""); }, [selectedAccount]);',
              'setCommentAutomationId(""); setStoryReplyAutomationId(""); setCommentTriggerKeywords(""); setCommentTriggerResponse(""); setStoryReplyTriggerKeywords(""); setStoryReplyTriggerResponse(""); }, [selectedAccount]);')
          replace_once(
              'function handleTypeChange(nextType: PublishType) { clearLocalMedia(); setUploadedMedia([]); setType(nextType); setUploadProgress(0); setCaption(""); if (nextType === "STORY") setCommentAutomationId(""); else setStoryReplyAutomationId(""); }',
              'function handleTypeChange(nextType: PublishType) { clearLocalMedia(); setUploadedMedia([]); setType(nextType); setUploadProgress(0); setCaption(""); if (nextType === "STORY") { setCommentAutomationId(""); setCommentTriggerKeywords(""); setCommentTriggerResponse(""); } else { setStoryReplyAutomationId(""); setStoryReplyTriggerKeywords(""); setStoryReplyTriggerResponse(""); } }')
          replace_once(
              'if (storyReplyAutomationId && type !== "STORY") { setError("شرط Reply استوری فقط برای Story قابل استفاده است."); return; }',
              'if (storyReplyAutomationId && type !== "STORY") { setError("شرط Reply استوری فقط برای Story قابل استفاده است."); return; }\n    const hasCommentTrigger = Boolean(commentTriggerKeywords.trim() || commentTriggerResponse.trim());\n    const hasStoryTrigger = Boolean(storyReplyTriggerKeywords.trim() || storyReplyTriggerResponse.trim());\n    if (type !== "STORY" && hasCommentTrigger && (!commentTriggerKeywords.trim() || !commentTriggerResponse.trim())) { setError("برای شرط کامنت، کلمات کلیدی و پاسخ را کامل کنید."); return; }\n    if (type === "STORY" && hasStoryTrigger && (!storyReplyTriggerKeywords.trim() || !storyReplyTriggerResponse.trim())) { setError("برای شرط Reply استوری، کلمات کلیدی و پاسخ را کامل کنید."); return; }\n    if (type !== "STORY" && commentAutomationId && hasCommentTrigger) { setError("یا Automation موجود را انتخاب کنید یا شرط سفارشی بسازید."); return; }\n    if (type === "STORY" && storyReplyAutomationId && hasStoryTrigger) { setError("یا Automation موجود را انتخاب کنید یا شرط سفارشی بسازید."); return; }')
          replace_once(
              'commentAutomationId: commentAutomationId || null, storyReplyAutomationId: storyReplyAutomationId || null, media: uploadedMedia',
              'commentAutomationId: commentAutomationId || null, storyReplyAutomationId: storyReplyAutomationId || null, commentTriggerKeywords: commentTriggerKeywords.trim() || null, commentTriggerResponse: commentTriggerResponse.trim() || null, storyReplyTriggerKeywords: storyReplyTriggerKeywords.trim() || null, storyReplyTriggerResponse: storyReplyTriggerResponse.trim() || null, media: uploadedMedia')
          replace_once(
              'setCaption(""); setUploadedMedia([]); setCommentAutomationId(""); setStoryReplyAutomationId(""); setUploadProgress(0); setScheduledDate(currentJalaliDate()); await loadJobs();',
              'setCaption(""); setUploadedMedia([]); setCommentAutomationId(""); setStoryReplyAutomationId(""); setCommentTriggerKeywords(""); setCommentTriggerResponse(""); setStoryReplyTriggerKeywords(""); setStoryReplyTriggerResponse(""); setUploadProgress(0); setScheduledDate(currentJalaliDate()); await loadJobs();')

          old_ui = '<div className="mb-5 rounded-2xl border border-slate-200 bg-slate-50 p-4"><div className="mb-3"><span className="block text-sm font-medium text-slate-700">شرط اجرای Automation</span><span className="mt-1 block text-xs leading-5 text-slate-400">برای این محتوای منتشرشده، یک Automation فعال را انتخاب کنید تا بعد از انتشار به Media ID واقعی Instagram متصل شود.</span></div>{type !== "STORY" && <label className="mb-3 block"><span className="mb-2 block text-xs font-medium text-slate-600">کامنت شرطی</span><select value={commentAutomationId} onChange={(e) => setCommentAutomationId(e.target.value)} className="w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm"><option value="">بدون شرط کامنت</option>{commentAutomations.map((item) => <option key={item.id} value={item.id}>{item.keyword ? `کلمات: ${item.keyword}` : "Automation کامنت"}</option>)}</select></label>}{type === "STORY" && <label className="block"><span className="mb-2 block text-xs font-medium text-slate-600">Reply استوری شرطی</span><select value={storyReplyAutomationId} onChange={(e) => setStoryReplyAutomationId(e.target.value)} className="w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm"><option value="">بدون شرط Reply استوری</option>{storyAutomations.map((item) => <option key={item.id} value={item.id}>{item.keyword ? `کلمات: ${item.keyword}` : "Automation استوری"}</option>)}</select></label>}{((type !== "STORY" && commentAutomations.length === 0) || (type === "STORY" && storyAutomations.length === 0)) && <p className="mt-2 text-xs text-slate-400">برای این نوع شرط Automation فعالی برای این اکانت وجود ندارد.</p>}</div>'
          new_ui = '<div className="mb-5 rounded-2xl border border-slate-200 bg-slate-50 p-4"><div className="mb-3"><span className="block text-sm font-medium text-slate-700">Trigger و پاسخ خودکار</span><span className="mt-1 block text-xs leading-5 text-slate-400">می‌توانید برای همین محتوای منتشرشده کلمات کلیدی و پاسخ اختصاصی تعریف کنید؛ Automation بعد از انتشار به Media ID واقعی متصل می‌شود.</span></div>{type !== "STORY" ? <div className="space-y-3"><label className="block"><span className="mb-2 block text-xs font-medium text-slate-600">کلمات کلیدی کامنت</span><input value={commentTriggerKeywords} onChange={(e) => setCommentTriggerKeywords(e.target.value)} placeholder="مثلاً 1، خرید، قیمت" className="w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm outline-none focus:border-slate-400" /><span className="mt-1 block text-[11px] text-slate-400">چند کلمه را با کاما یا Enter جدا کنید.</span></label><label className="block"><span className="mb-2 block text-xs font-medium text-slate-600">پاسخ خودکار</span><textarea value={commentTriggerResponse} onChange={(e) => setCommentTriggerResponse(e.target.value)} rows={3} placeholder="متن پاسخ خودکار..." className="w-full resize-none rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm outline-none focus:border-slate-400" /></label><details className="rounded-xl border border-slate-200 bg-white p-3"><summary className="cursor-pointer text-xs font-medium text-slate-600">یا یک Automation موجود انتخاب کنید</summary><select value={commentAutomationId} onChange={(e) => setCommentAutomationId(e.target.value)} className="mt-3 w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm"><option value="">بدون Automation موجود</option>{commentAutomations.map((item) => <option key={item.id} value={item.id}>{item.keyword ? `کلمات: ${item.keyword}` : "Automation کامنت"}</option>)}</select></details></div> : <div className="space-y-3"><label className="block"><span className="mb-2 block text-xs font-medium text-slate-600">کلمات کلیدی Reply استوری</span><input value={storyReplyTriggerKeywords} onChange={(e) => setStoryReplyTriggerKeywords(e.target.value)} placeholder="مثلاً 1، خرید، قیمت" className="w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm outline-none focus:border-slate-400" /><span className="mt-1 block text-[11px] text-slate-400">چند کلمه را با کاما یا Enter جدا کنید.</span></label><label className="block"><span className="mb-2 block text-xs font-medium text-slate-600">پاسخ خودکار</span><textarea value={storyReplyTriggerResponse} onChange={(e) => setStoryReplyTriggerResponse(e.target.value)} rows={3} placeholder="متن پاسخ دایرکت..." className="w-full resize-none rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm outline-none focus:border-slate-400" /></label><details className="rounded-xl border border-slate-200 bg-white p-3"><summary className="cursor-pointer text-xs font-medium text-slate-600">یا یک Automation موجود انتخاب کنید</summary><select value={storyReplyAutomationId} onChange={(e) => setStoryReplyAutomationId(e.target.value)} className="mt-3 w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm"><option value="">بدون Automation موجود</option>{storyAutomations.map((item) => <option key={item.id} value={item.id}>{item.keyword ? `کلمات: ${item.keyword}` : "Automation استوری"}</option>)}</select></details></div>}</div>'
          replace_once(old_ui, new_ui)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Remove temporary workflows
        run: rm -f .github/workflows/fix-instagram-seen.yml .github/workflows/apply-ui-patches.yml

      - name: Commit final fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api/webhooks/instagram/route.ts components/dashboard/AutomationForm.tsx components/dashboard/publishing/PublishingDashboard.tsx .github/workflows/fix-instagram-seen.yml .github/workflows/apply-ui-patches.yml
          git diff --cached --quiet && exit 0
          git commit -m 'feat: complete automation and publishing trigger fixes'
          git push origin HEAD:master
