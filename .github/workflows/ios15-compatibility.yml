name: iOS 15 compatibility preview

on:
  pull_request:
    branches: [master]
    paths:
      - "package.json"
      - "package-lock.json"
      - "app/**"
      - "components/**"
      - "next.config.ts"

permissions:
  contents: write

jobs:
  lockfile-and-build:
    if: github.head_ref == 'fix/ios15-safari-login'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile for the trial versions
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit synchronized lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Sync lockfile for iOS 15 compatibility trial"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Install exactly from lockfile
        run: npm ci
      - name: Build application
        env:
          NODE_ENV: production
          NEXTAUTH_URL: https://example.invalid
          NEXTAUTH_SECRET: ci-only-placeholder-secret-with-more-than-32-characters
          CRON_SECRET: ci-only-placeholder-cron-secret-with-more-than-32-characters
          DATABASE_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
          DIRECT_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
          REDIS_DRIVER: local
          REDIS_LOCAL_URL: redis://127.0.0.1:6379
        run: npm run build
