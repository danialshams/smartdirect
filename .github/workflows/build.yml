name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Prisma config requires a DATABASE_URL during client generation.
      # Build-only placeholder; this workflow does not connect to a database.
      DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: build-only-placeholder-secret-not-for-production
      CRON_SECRET: build-only-placeholder-cron-secret
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Build application
        run: npx next build
