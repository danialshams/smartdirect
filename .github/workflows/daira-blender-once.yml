name: One-time offline Blender Daira hero rendering

on:
  push:
    branches: [feature/blender-rendered-robot-hero-20261031]
    paths:
      - "scripts/render-daira-blender.py"
      - "package.json"
      - ".github/workflows/daira-blender-once.yml"

permissions:
  contents: write

concurrency:
  group: daira-blender-render-once
  cancel-in-progress: false

jobs:
  create-rendered-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Update npm lockfile after removing unused client WebGL
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install offline-only open source Blender and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq blender ffmpeg
          blender --version | head -3
      - name: Render 40 real 3D Blender frames to ephemeral runner storage
        run: |
          mkdir -p /tmp/daira-render-frames
          blender --background -t 3 --python scripts/render-daira-blender.py -- /tmp/daira-render-frames
          test "$(find /tmp/daira-render-frames -name 'frame-*.png' | wc -l)" -eq 40
      - name: Encode iOS-compatible MP4 and lightweight WebM
        run: |
          ffmpeg -hide_banner -loglevel error -y -framerate 20 -i /tmp/daira-render-frames/frame-%03d.png -an -c:v libx264 -preset medium -crf 25 -pix_fmt yuv420p -movflags +faststart public/landing/daira-robot-motion.mp4
          ffmpeg -hide_banner -loglevel error -y -framerate 20 -i /tmp/daira-render-frames/frame-%03d.png -an -c:v libvpx-vp9 -deadline good -cpu-used 5 -b:v 0 -crf 36 -pix_fmt yuv420p public/landing/daira-robot-motion.webm
          for f in public/landing/daira-robot-motion.{mp4,webm}; do
            test -s "$f"
            test "$(stat -c%s "$f")" -lt 1900000
            echo "Created $f: $(stat -c%s "$f") bytes"
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "$f"
          done
      - name: Commit only optimized generated assets and npm lock to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json public/landing/daira-robot-motion.mp4 public/landing/daira-robot-motion.webm
          git diff --cached --quiet && { echo "No files generated"; exit 1; }
          git commit -m "Render and compress original Daira robot in offline Blender"
          git push origin HEAD:feature/blender-rendered-robot-hero-20261031
