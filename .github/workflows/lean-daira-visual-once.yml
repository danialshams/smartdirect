name: Temporary lean Daira landing browser QA
on:
  push:
    branches: [feature/lean-intro-glass-header-20261031]
    paths: [".github/workflows/lean-daira-visual-once.yml"]
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install app and two real browser engines
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.0
          npx playwright install --with-deps chromium webkit
      - name: Inspect compact saturated blue optical login across six viewports
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/daira-lean.log 2>&1 &
          PID=$!
          trap "kill $PID || true" EXIT
          for i in $(seq 1 65); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/; then break; fi
            sleep 2
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:3000/
          node scripts/qa-lean-landing.cjs
      - name: Keep screenshots on isolated branch for visual inspection
        if: always()
        run: |
          test -d public/qa-lean || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/qa-lean
          git diff --cached --quiet && exit 0
          git commit -m "Temporary browser QA screenshots: minimal features and corrected liquid glass"
          git push origin HEAD:feature/lean-intro-glass-header-20261031
