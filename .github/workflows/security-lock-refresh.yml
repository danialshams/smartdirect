name: Security dependency lock refresh
on:
  push:
    branches: [security/full-hardening-20261102]
    paths:
      - ".github/workflows/security-lock-refresh.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'danialshams/smartdirect' && github.ref == 'refs/heads/security/full-hardening-20261102'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Resolve reviewed patched versions without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --save-exact next@16.4.3 sharp@0.35.5
      - name: Verify safe dependencies are locked
        run: |
          node -e 'const p=require("./package-lock.json"); if(p.packages["node_modules/next"].version!=="16.4.3" || p.packages["node_modules/sharp"].version!=="0.35.5")process.exit(1)'
      - name: Push lockfile to security branch
        run: |
          git config user.name "daira-security-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || (git commit -m "Patch Next.js and Sharp security advisories with resolved lockfile" && git push origin HEAD:security/full-hardening-20261102)
