name: Apply SmartDirect fixes

on:
  push:
    paths:
      - '.github/workflows/apply-smartdirect-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch application files
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 match, got {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # -----------------------------------------------------------------
          # AutomationForm: keyword chips, while preserving the existing
          # backend contract (stored as comma-separated normalized keywords).
          # -----------------------------------------------------------------
          replace_once(
              'components/dashboard/AutomationForm.tsx',
              '''function KeywordInput({
              keyword,
              setKeyword,
              description,
          }: {
              keyword: string;
              setKeyword: (
                  value: string
              ) => void;
              description: string;
          }) {
              return (
                  <div>
                      <label className="mb-2 block text-sm font-medium text-gray-800">
                          کلمه یا عبارت Trigger
                      </label>

                      <input
                          value={
                              keyword
                          }
                          onChange={(
                              event
                          ) =>
                              setKeyword(
                                  event
                                      .target
                                      .value
                              )
                          }
                          placeholder="مثلاً 1"
                          className="w-full rounded-xl border border-gray-200 px-4 py-3 text-sm outline-none transition focus:border-gray-900"
                      />

                      <p className="mt-2 text-xs leading-5 text-gray-400">
                          {
                              description
                          }
                      </p>
                  </div>
              );
          }''',
              '''function KeywordInput({
              keyword,
              setKeyword,
              description,
          }: {
              keyword: string;
              setKeyword: (value: string) => void;
              description: string;
          }) {
              const parseKeywords = (value: string) =>
                  value
                      .split(/[\\n,،;؛]+/)
                      .map((item) => item.trim())
                      .filter(Boolean)
                      .filter((item, index, list) => list.indexOf(item) === index);

              const keywords = parseKeywords(keyword);

              const [draft, setDraft] = useState("");

              function sync(next: string[]) {
                  setKeyword(next.join(","));
              }

              function addKeyword() {
                  const value = draft.trim();
                  if (!value) return;
                  sync([...keywords, value].filter((item, index, list) => list.indexOf(item) === index));
                  setDraft("");
              }

              function removeKeyword(value: string) {
                  sync(keywords.filter((item) => item !== value));
              }

              function handleKeyDown(event: React.KeyboardEvent<HTMLInputElement>) {
                  if (event.key === "Enter" || event.key === "," || event.key === "،") {
                      event.preventDefault();
                      addKeyword();
                  }
              }

              return (
                  <div>
                      <label className="mb-2 block text-sm font-medium text-gray-800">
                          کلمات کلیدی Trigger
                      </label>

                      <div className="flex min-h-[52px] flex-wrap items-center gap-2 rounded-xl border border-gray-200 px-3 py-2 transition focus-within:border-gray-900">
                          {keywords.map((item) => (
                              <span key={item} className="inline-flex items-center gap-1 rounded-full bg-gray-100 px-3 py-1.5 text-xs font-medium text-gray-700">
                                  {item}
                                  <button type="button" onClick={() => removeKeyword(item)} className="text-gray-400 hover:text-gray-900" aria-label={`حذف ${item}`}>
                                      <X size={13} />
                                  </button>
                              </span>
                          ))}

                          <input
                              value={draft}
                              onChange={(event) => setDraft(event.target.value)}
                              onKeyDown={handleKeyDown}
                              onBlur={addKeyword}
                              placeholder={keywords.length ? "کلمه بعدی..." : "مثلاً 1 یا یک"}
                              className="min-w-[140px] flex-1 border-0 bg-transparent px-1 py-1 text-sm outline-none"
                          />

                          <button type="button" onClick={addKeyword} className="inline-flex shrink-0 items-center gap-1 rounded-lg border border-gray-200 px-2.5 py-1.5 text-xs font-medium text-gray-600 hover:bg-gray-50">
                              <Plus size={13} />
                              افزودن
                          </button>
                      </div>

                      <p className="mt-2 text-xs leading-5 text-gray-400">
                          {description} چند کلمه را با Enter یا «افزودن» اضافه کنید.
                      </p>
                  </div>
              );
          }'''
          )

          # -----------------------------------------------------------------
          # Publishing schema: persist custom trigger configuration on the job.
          # The actual Automation is created only after Instagram returns the
          # real Media ID, which avoids fake/unbound automations.
          # -----------------------------------------------------------------
          replace_once(
              'prisma/schema.prisma',
              '''  userTags               Json?
  commentAutomationId    String?
  storyReplyAutomationId String?
  scheduledAt            DateTime?''',
              '''  userTags               Json?
  commentAutomationId    String?
  storyReplyAutomationId String?
  commentTriggerKeywords String?
  commentTriggerResponse String?
  storyReplyTriggerKeywords String?
  storyReplyTriggerResponse String?
  scheduledAt            DateTime?'''
          )

          # -----------------------------------------------------------------
          # Publishing API: accept and validate custom trigger config.
          # -----------------------------------------------------------------
          replace_once(
              'app/api/instagram/publishing/route.ts',
              '''  commentAutomationId: z.string().min(1).optional().nullable(),
  storyReplyAutomationId: z.string().min(1).optional().nullable(),
  media:''',
              '''  commentAutomationId: z.string().min(1).optional().nullable(),
  storyReplyAutomationId: z.string().min(1).optional().nullable(),
  commentTriggerKeywords: z.string().trim().max(1000).optional().nullable(),
  commentTriggerResponse: z.string().trim().max(2000).optional().nullable(),
  storyReplyTriggerKeywords: z.string().trim().max(1000).optional().nullable(),
  storyReplyTriggerResponse: z.string().trim().max(2000).optional().nullable(),
  media:'''
          )

          replace_once(
              'app/api/instagram/publishing/route.ts',
              '''    const data = parsed.data;
    const normalizedUserTags''',
              '''    const data = parsed.data;
    const hasCommentTrigger = Boolean(data.commentTriggerKeywords?.trim() || data.commentTriggerResponse?.trim());
    const hasStoryReplyTrigger = Boolean(data.storyReplyTriggerKeywords?.trim() || data.storyReplyTriggerResponse?.trim());
    if (hasCommentTrigger && data.type === "STORY") return NextResponse.json({ success: false, message: "شرط کامنت برای Story قابل استفاده نیست." }, { status: 400 });
    if (hasStoryReplyTrigger && data.type !== "STORY") return NextResponse.json({ success: false, message: "شرط Reply استوری فقط برای Story قابل استفاده است." }, { status: 400 });
    if (hasCommentTrigger && (!data.commentTriggerKeywords?.trim() || !data.commentTriggerResponse?.trim())) return NextResponse.json({ success: false, message: "برای شرط کامنت، کلمات کلیدی و پاسخ الزامی است." }, { status: 400 });
    if (hasStoryReplyTrigger && (!data.storyReplyTriggerKeywords?.trim() || !data.storyReplyTriggerResponse?.trim())) return NextResponse.json({ success: false, message: "برای شرط Reply استوری، کلمات کلیدی و پاسخ الزامی است." }, { status: 400 });
    if (data.commentAutomationId && hasCommentTrigger) return NextResponse.json({ success: false, message: "همزمان انتخاب Automation کامنت و شرط کامنت سفارشی مجاز نیست." }, { status: 400 });
    if (data.storyReplyAutomationId && hasStoryReplyTrigger) return NextResponse.json({ success: false, message: "همزمان انتخاب Automation استوری و شرط Reply سفارشی مجاز نیست." }, { status: 400 });
    const normalizedUserTags'''
          )

          replace_once(
              'app/api/instagram/publishing/route.ts',
              '''          commentAutomationId: data.commentAutomationId ?? null,
          storyReplyAutomationId: data.storyReplyAutomationId ?? null,
          scheduledAt,''',
              '''          commentAutomationId: data.commentAutomationId ?? null,
          storyReplyAutomationId: data.storyReplyAutomationId ?? null,
          commentTriggerKeywords: data.commentTriggerKeywords?.trim() || null,
          commentTriggerResponse: data.commentTriggerResponse?.trim() || null,
          storyReplyTriggerKeywords: data.storyReplyTriggerKeywords?.trim() || null,
          storyReplyTriggerResponse: data.storyReplyTriggerResponse?.trim() || null,
          scheduledAt,'''
          )

          # -----------------------------------------------------------------
          # Publishing worker: create the conditional Automation after the
          # real Instagram media ID exists. Reuse an existing identical one
          # on retry instead of creating duplicates.
          # -----------------------------------------------------------------
          replace_once(
              'src/lib/instagram/publishing.ts',
              '''async function bindConditionalAutomations(job: { commentAutomationId: string | null; storyReplyAutomationId: string | null; instagramAccountId: string; type: string }, instagramMediaId: string) {
  if (job.commentAutomationId && job.type !== "STORY") {
    await prisma.automation.updateMany({ where: { id: job.commentAutomationId, instagramAccountId: job.instagramAccountId, triggerType: "COMMENT_KEYWORD" }, data: { mediaId: instagramMediaId } });
  }
  if (job.storyReplyAutomationId && job.type === "STORY") {
    await prisma.automation.updateMany({ where: { id: job.storyReplyAutomationId, instagramAccountId: job.instagramAccountId, triggerType: "STORY_REPLY_KEYWORD" }, data: { mediaId: instagramMediaId } });
  }
}''',
              '''function splitTriggerKeywords(value: string | null) {
  if (!value) return [];
  return value.split(/[\\n,،;؛]+/).map((item) => item.trim()).filter(Boolean).filter((item, index, list) => list.indexOf(item) === index);
}

async function createConditionalAutomation(
  instagramAccountId: string,
  triggerType: "COMMENT_KEYWORD" | "STORY_REPLY_KEYWORD",
  keywords: string | null,
  response: string | null,
  instagramMediaId: string,
) {
  const normalizedKeywords = splitTriggerKeywords(keywords);
  if (!normalizedKeywords.length || !response?.trim()) return;

  const keyword = normalizedKeywords.join(",");
  const existing = await prisma.automation.findFirst({
    where: { instagramAccountId, triggerType, keyword, mediaId: instagramMediaId },
    select: { id: true },
  });
  if (existing) return existing.id;

  const automation = await prisma.automation.create({
    data: {
      instagramAccountId,
      triggerType,
      keyword,
      mediaId: instagramMediaId,
      sendDm: true,
      replyText: response.trim(),
      isActive: true,
    },
    select: { id: true },
  });
  return automation.id;
}

async function bindConditionalAutomations(job: {
  commentAutomationId: string | null;
  storyReplyAutomationId: string | null;
  commentTriggerKeywords: string | null;
  commentTriggerResponse: string | null;
  storyReplyTriggerKeywords: string | null;
  storyReplyTriggerResponse: string | null;
  instagramAccountId: string;
  type: string;
}, instagramMediaId: string) {
  if (job.commentAutomationId && job.type !== "STORY") {
    await prisma.automation.updateMany({ where: { id: job.commentAutomationId, instagramAccountId: job.instagramAccountId, triggerType: "COMMENT_KEYWORD" }, data: { mediaId: instagramMediaId } });
  }
  if (job.storyReplyAutomationId && job.type === "STORY") {
    await prisma.automation.updateMany({ where: { id: job.storyReplyAutomationId, instagramAccountId: job.instagramAccountId, triggerType: "STORY_REPLY_KEYWORD" }, data: { mediaId: instagramMediaId } });
  }
  if (!job.commentAutomationId && job.type !== "STORY") {
    await createConditionalAutomation(job.instagramAccountId, "COMMENT_KEYWORD", job.commentTriggerKeywords, job.commentTriggerResponse, instagramMediaId);
  }
  if (!job.storyReplyAutomationId && job.type === "STORY") {
    await createConditionalAutomation(job.instagramAccountId, "STORY_REPLY_KEYWORD", job.storyReplyTriggerKeywords, job.storyReplyTriggerResponse, instagramMediaId);
  }
}'''
          )

          replace_once(
              'src/lib/instagram/publishing.ts',
              '''    const updatedJob = await prisma.instagramPublishJob.update({''',
              '''    const updatedJob = await prisma.instagramPublishJob.update({'''
          )

          # -----------------------------------------------------------------
          # PublishingDashboard: custom keyword + response instead of forcing
          # users to pre-create an Automation.
          # -----------------------------------------------------------------
          replace_once(
              'components/dashboard/publishing/PublishingDashboard.tsx',
              '''const [commentAutomationId, setCommentAutomationId] = useState(""); const [storyReplyAutomationId, setStoryReplyAutomationId] = useState("");''',
              '''const [commentAutomationId, setCommentAutomationId] = useState(""); const [storyReplyAutomationId, setStoryReplyAutomationId] = useState(""); const [commentTriggerKeywords, setCommentTriggerKeywords] = useState(""); const [commentTriggerResponse, setCommentTriggerResponse] = useState(""); const [storyReplyTriggerKeywords, setStoryReplyTriggerKeywords] = useState(""); const [storyReplyTriggerResponse, setStoryReplyTriggerResponse] = useState("");'''
          )

          replace_once(
              'components/dashboard/publishing/PublishingDashboard.tsx',
              '''setCommentAutomationId(""); setStoryReplyAutomationId(""); }, [selectedAccount]);''',
              '''setCommentAutomationId(""); setStoryReplyAutomationId(""); setCommentTriggerKeywords(""); setCommentTriggerResponse(""); setStoryReplyTriggerKeywords(""); setStoryReplyTriggerResponse(""); }, [selectedAccount]);'''
          )

          replace_once(
              'components/dashboard/publishing/PublishingDashboard.tsx',
              '''if (nextType === "STORY") setCommentAutomationId(""); else setStoryReplyAutomationId(""); }''',
              '''if (nextType === "STORY") { setCommentAutomationId(""); setCommentTriggerKeywords(""); setCommentTriggerResponse(""); } else { setStoryReplyAutomationId(""); setStoryReplyTriggerKeywords(""); setStoryReplyTriggerResponse(""); } }'''
          )

          old_publish_validation = '''if (commentAutomationId && type === "STORY") { setError("شرط کامنت برای Story قابل استفاده نیست."); return; }
    if (storyReplyAutomationId && type !== "STORY") { setError("شرط Reply استوری فقط برای Story قابل استفاده است."); return; }'''
          new_publish_validation = '''if (commentAutomationId && type === "STORY") { setError("شرط کامنت برای Story قابل استفاده نیست."); return; }
    if (storyReplyAutomationId && type !== "STORY") { setError("شرط Reply استوری فقط برای Story قابل استفاده است."); return; }
    if (type !== "STORY" && (commentTriggerKeywords.trim() || commentTriggerResponse.trim()) && (!commentTriggerKeywords.trim() || !commentTriggerResponse.trim())) { setError("برای شرط کامنت، کلمات کلیدی و پاسخ را کامل کنید."); return; }
    if (type === "STORY" && (storyReplyTriggerKeywords.trim() || storyReplyTriggerResponse.trim()) && (!storyReplyTriggerKeywords.trim() || !storyReplyTriggerResponse.trim())) { setError("برای شرط Reply استوری، کلمات کلیدی و پاسخ را کامل کنید."); return; }
    if (type !== "STORY" && commentAutomationId && commentTriggerKeywords.trim()) { setError("یا Automation کامنت انتخاب کنید یا شرط سفارشی بسازید."); return; }
    if (type === "STORY" && storyReplyAutomationId && storyReplyTriggerKeywords.trim()) { setError("یا Automation استوری انتخاب کنید یا شرط سفارشی بسازید."); return; }'''
          replace_once('components/dashboard/publishing/PublishingDashboard.tsx', old_publish_validation, new_publish_validation)

          replace_once(
              'components/dashboard/publishing/PublishingDashboard.tsx',
              '''commentAutomationId: commentAutomationId || null, storyReplyAutomationId: storyReplyAutomationId || null, media: uploadedMedia''',
              '''commentAutomationId: commentAutomationId || null, storyReplyAutomationId: storyReplyAutomationId || null, commentTriggerKeywords: commentTriggerKeywords.trim() || null, commentTriggerResponse: commentTriggerResponse.trim() || null, storyReplyTriggerKeywords: storyReplyTriggerKeywords.trim() || null, storyReplyTriggerResponse: storyReplyTriggerResponse.trim() || null, media: uploadedMedia'''
          )

          replace_once(
              'components/dashboard/publishing/PublishingDashboard.tsx',
              '''setCaption(""); setUploadedMedia([]); setCommentAutomationId(""); setStoryReplyAutomationId(""); setUploadProgress(0);''',
              '''setCaption(""); setUploadedMedia([]); setCommentAutomationId(""); setStoryReplyAutomationId(""); setCommentTriggerKeywords(""); setCommentTriggerResponse(""); setStoryReplyTriggerKeywords(""); setStoryReplyTriggerResponse(""); setUploadProgress(0);'''
          )

          old_ui = '''<div className="mb-5 rounded-2xl border border-slate-200 bg-slate-50 p-4"><div className="mb-3"><span className="block text-sm font-medium text-slate-700">شرط اجرای Automation</span><span className="mt-1 block text-xs leading-5 text-slate-400">برای این محتوای منتشرشده، یک Automation فعال را انتخاب کنید تا بعد از انتشار به Media ID واقعی Instagram متصل شود.</span></div>{type !== "STORY" && <label className="mb-3 block"><span className="mb-2 block text-xs font-medium text-slate-600">کامنت شرطی</span><select value={commentAutomationId} onChange={(e) => setCommentAutomationId(e.target.value)} className="w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm"><option value="">بدون شرط کامنت</option>{commentAutomations.map((item) => <option key={item.id} value={item.id}>{item.keyword ? `کلمات: ${item.keyword}` : "Automation کامنت"}</option>)}</select></label>}{type === "STORY" && <label className="block"><span className="mb-2 block text-xs font-medium text-slate-600">Reply استوری شرطی</span><select value={storyReplyAutomationId} onChange={(e) => setStoryReplyAutomationId(e.target.value)} className="w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm"><option value="">بدون شرط Reply استوری</option>{storyAutomations.map((item) => <option key={item.id} value={item.id}>{item.keyword ? `کلمات: ${item.keyword}` : "Automation استوری"}</option>)}</select></label>}{((type !== "STORY" && commentAutomations.length === 0) || (type === "STORY" && storyAutomations.length === 0)) && <p className="mt-2 text-xs text-slate-400">برای این نوع شرط Automation فعالی برای این اکانت وجود ندارد.</p>}</div>'''
          new_ui = '''<div className="mb-5 rounded-2xl border border-slate-200 bg-slate-50 p-4"><div className="mb-3"><span className="block text-sm font-medium text-slate-700">Trigger و پاسخ خودکار</span><span className="mt-1 block text-xs leading-5 text-slate-400">برای همین محتوای منتشرشده، کلمات کلیدی و پاسخ دلخواه را وارد کنید. Automation بعد از انتشار و دریافت Media ID واقعی ساخته می‌شود.</span></div>{type !== "STORY" ? <div className="space-y-3"><label className="block"><span className="mb-2 block text-xs font-medium text-slate-600">کلمات کلیدی کامنت</span><input value={commentTriggerKeywords} onChange={(e) => setCommentTriggerKeywords(e.target.value)} placeholder="مثلاً 1، خرید، قیمت" className="w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm outline-none focus:border-slate-400" /></label><label className="block"><span className="mb-2 block text-xs font-medium text-slate-600">پاسخ خودکار</span><textarea value={commentTriggerResponse} onChange={(e) => setCommentTriggerResponse(e.target.value)} rows={3} placeholder="مثلاً سلام، اطلاعات محصول برای شما ارسال شد." className="w-full resize-none rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm outline-none focus:border-slate-400" /></label></div> : <div className="space-y-3"><label className="block"><span className="mb-2 block text-xs font-medium text-slate-600">کلمات کلیدی Reply استوری</span><input value={storyReplyTriggerKeywords} onChange={(e) => setStoryReplyTriggerKeywords(e.target.value)} placeholder="مثلاً 1، خرید، قیمت" className="w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm outline-none focus:border-slate-400" /></label><label className="block"><span className="mb-2 block text-xs font-medium text-slate-600">پاسخ خودکار</span><textarea value={storyReplyTriggerResponse} onChange={(e) => setStoryReplyTriggerResponse(e.target.value)} rows={3} placeholder="متن پاسخ دایرکت..." className="w-full resize-none rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm outline-none focus:border-slate-400" /></label></div>}</div>'''
          replace_once('components/dashboard/publishing/PublishingDashboard.tsx', old_ui, new_ui)

          # Migration for production Neon/Vercel.
          migration = Path('prisma/migrations/20260915173000_add_publish_trigger_config/migration.sql')
          migration.parent.mkdir(parents=True, exist_ok=True)
          migration.write_text('''ALTER TABLE "InstagramPublishJob"\n  ADD COLUMN "commentTriggerKeywords" TEXT,\n  ADD COLUMN "commentTriggerResponse" TEXT,\n  ADD COLUMN "storyReplyTriggerKeywords" TEXT,\n  ADD COLUMN "storyReplyTriggerResponse" TEXT;\n''', encoding='utf-8')

          # Remove this temporary workflow so the repository stays clean.
          Path('.github/workflows/apply-smartdirect-fixes.yml').unlink()

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/instagram/publishing/route.ts components/dashboard/AutomationForm.tsx components/dashboard/publishing/PublishingDashboard.tsx prisma/schema.prisma prisma/migrations/20260915173000_add_publish_trigger_config/migration.sql src/lib/instagram/publishing.ts .github/workflows/apply-smartdirect-fixes.yml
          git commit -m "fix: custom publishing triggers and automation keywords" || exit 0
          git push origin HEAD:master
