name: One-off true liquid optics QA

on:
  push:
    branches: [feature/true-liquid-optics-refinement-20261031]
    paths: [".github/workflows/true-liquid-qa-once.yml"]

permissions:
  contents: write

jobs:
  optical-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install project and Chromium/WebKit for actual glass strategy testing
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.58.0
          npx playwright install --with-deps chromium webkit
      - name: Verify tuned liquid optics and readable navy menu on Chromium and WebKit
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/daira-liquid-qa.log 2>&1 &
          PID=$!
          trap "kill $PID || true" EXIT
          for i in $(seq 1 65); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/; then break; fi
            sleep 2
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:3000/
          node scripts/qa-optical-lenses.cjs
      - name: Commit optical diagnostics even if a browser cannot initialize refraction
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -d public/qa-liquid || exit 0
          git add public/qa-liquid/
          git diff --cached --quiet && exit 0
          git commit -m "Capture refractive glass on Chromium and WebKit, light and dark scenes"
          git push origin HEAD:feature/true-liquid-optics-refinement-20261031
