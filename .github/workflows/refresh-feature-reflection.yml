name: Refresh actual Daira landing reflection after feature build

on:
  push:
    branches:
      - feature/daira-sequential-card-build-and-license-20261101
    paths:
      - .github/workflows/refresh-feature-reflection.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: smartdirect
        ports: ["5432:5432"]
    env:
      NODE_ENV: production
      VERCEL: "1"
      VERCEL_ENV: production
      NEXTAUTH_URL: http://127.0.0.1:3198
      NEXTAUTH_SECRET: ci-only-placeholder-secret-with-more-than-32-characters
      CRON_SECRET: ci-only-placeholder-cron-secret-with-more-than-32-characters
      DATABASE_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
      DIRECT_URL: postgresql://user:password@127.0.0.1:5432/smartdirect?sslmode=disable
      REDIS_DRIVER: redis
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install app and Chromium screenshot dependencies
        env:
          NODE_ENV: development
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build original homepage
        run: npm run build
      - name: Regenerate 20 actual page optical tiles
        run: node scripts/regenerate-landing-reflection.mjs
      - name: Commit regenerated responsive reflection source assets
        run: |
          set -euo pipefail
          test "$(find public/landing-reflection -maxdepth 1 -name '*.jpg' | wc -l)" -eq 20
          mkdir -p /tmp/daira-reflection-tiles
          cp -a public/landing-reflection/. /tmp/daira-reflection-tiles/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin feature/daira-sequential-card-build-and-license-20261101
          git checkout -B feature/daira-sequential-card-build-and-license-20261101 FETCH_HEAD
          cp -a /tmp/daira-reflection-tiles/. public/landing-reflection/
          git add public/landing-reflection
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh 20 genuine WebKit optical source images after staged feature design'
            git push origin HEAD:feature/daira-sequential-card-build-and-license-20261101
          fi
