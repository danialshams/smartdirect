name: Prepare pinned Three.js robot dependencies

on:
  push:
    branches: [feature/true-3d-daira-robot-20261031]
    paths:
      - package.json

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve and pin package-lock from reviewed package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated dependency lockfile to isolated branch only
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Lock React Three Fiber and Three.js dependency graph"
            git push origin HEAD:feature/true-3d-daira-robot-20261031
          fi
