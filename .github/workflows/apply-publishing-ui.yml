name: Apply Publishing UI Updates

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch UI files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # ---------------- AutomationForm: multi-keyword chips ----------------
          p = Path('components/dashboard/AutomationForm.tsx')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'function KeywordInput\(\{.*?\n\}\n\n/\* -------------------------------------------------------------------------- \*/\n/\* Local Helpers', re.S)
          replacement = '''function KeywordInput({
              keyword,
              setKeyword,
              description,
          }: {
              keyword: string;
              setKeyword: (value: string) => void;
              description: string;
          }) {
              const keywords = keyword
                  .split(/[\\n,،;؛]+/)
                  .map((item) => item.trim())
                  .filter(Boolean)
                  .filter((item, index, list) => list.indexOf(item) === index);
              const [draft, setDraft] = useState("");

              function sync(next: string[]) {
                  setKeyword(next.join(","));
              }

              function addKeyword() {
                  const value = draft.trim();
                  if (!value) return;
                  sync([...keywords, value].filter((item, index, list) => list.indexOf(item) === index));
                  setDraft("");
              }

              function removeKeyword(value: string) {
                  sync(keywords.filter((item) => item !== value));
              }

              return (
                  <div>
                      <label className="mb-2 block text-sm font-medium text-gray-800">
                          کلمات کلیدی Trigger
                      </label>

                      <div className="flex min-h-[52px] flex-wrap items-center gap-2 rounded-xl border border-gray-200 px-3 py-2 transition focus-within:border-gray-900">
                          {keywords.map((item) => (
                              <span
                                  key={item}
                                  className="inline-flex items-center gap-1 rounded-full bg-gray-100 px-3 py-1.5 text-xs font-medium text-gray-700"
                              >
                                  {item}
                                  <button
                                      type="button"
                                      onClick={() => removeKeyword(item)}
                                      className="text-gray-400 transition hover:text-gray-900"
                                      aria-label={`حذف ${item}`}
                                  >
                                      <X size={13} />
                                  </button>
                              </span>
                          ))}

                          <input
                              value={draft}
                              onChange={(event) => setDraft(event.target.value)}
                              onKeyDown={(event) => {
                                  if (event.key === "Enter" || event.key === "," || event.key === "،") {
                                      event.preventDefault();
                                      addKeyword();
                                  }
                              }}
                              onBlur={addKeyword}
                              placeholder={keywords.length ? "کلمه بعدی..." : "مثلاً 1 یا یک"}
                              className="min-w-[140px] flex-1 border-0 bg-transparent px-1 py-1 text-sm outline-none"
                          />

                          <button
                              type="button"
                              onClick={addKeyword}
                              className="shrink-0 rounded-lg border border-gray-200 px-2.5 py-1.5 text-xs font-medium text-gray-600 transition hover:bg-gray-50"
                          >
                              افزودن کلمه
                          </button>
                      </div>

                      <p className="mt-2 text-xs leading-5 text-gray-400">
                          {description} چند کلمه را با Enter یا «افزودن کلمه» اضافه کنید.
                      </p>
                  </div>
              );
          }

          /* -------------------------------------------------------------------------- */
          /* Local Helpers'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'AutomationForm KeywordInput replacement failed: {n}')
          p.write_text(s2, encoding='utf-8')

          # ---------------- PublishingDashboard: custom trigger configuration ----------------
          p = Path('components/dashboard/publishing/PublishingDashboard.tsx')
          s = p.read_text(encoding='utf-8')

          old_state = 'const [commentAutomationId, setCommentAutomationId] = useState(""); const [storyReplyAutomationId, setStoryReplyAutomationId] = useState("");'
          new_state = 'const [commentAutomationId, setCommentAutomationId] = useState(""); const [storyReplyAutomationId, setStoryReplyAutomationId] = useState(""); const [commentTriggerKeywords, setCommentTriggerKeywords] = useState(""); const [commentTriggerResponse, setCommentTriggerResponse] = useState(""); const [storyReplyTriggerKeywords, setStoryReplyTriggerKeywords] = useState(""); const [storyReplyTriggerResponse, setStoryReplyTriggerResponse] = useState("");'
          if s.count(old_state) != 1:
              raise SystemExit(f'PublishingDashboard state replacement failed: {s.count(old_state)}')
          s = s.replace(old_state, new_state, 1)

          old_effect = 'useEffect(() => { if (selectedAccount) void loadAutomations(selectedAccount).catch((e) => setError(e instanceof Error ? e.message : "دریافت Automation ها ناموفق بود.")); else setAutomations([]); setCommentAutomationId(""); setStoryReplyAutomationId(""); }, [selectedAccount]);'
          new_effect = 'useEffect(() => { if (selectedAccount) void loadAutomations(selectedAccount).catch((e) => setError(e instanceof Error ? e.message : "دریافت Automation ها ناموفق بود.")); else setAutomations([]); setCommentAutomationId(""); setStoryReplyAutomationId(""); setCommentTriggerKeywords(""); setCommentTriggerResponse(""); setStoryReplyTriggerKeywords(""); setStoryReplyTriggerResponse(""); }, [selectedAccount]);'
          if s.count(old_effect) != 1:
              raise SystemExit(f'PublishingDashboard account effect replacement failed: {s.count(old_effect)}')
          s = s.replace(old_effect, new_effect, 1)

          old_type = 'function handleTypeChange(nextType: PublishType) { clearLocalMedia(); setUploadedMedia([]); setType(nextType); setUploadProgress(0); setCaption(""); if (nextType === "STORY") setCommentAutomationId(""); else setStoryReplyAutomationId(""); }'
          new_type = 'function handleTypeChange(nextType: PublishType) { clearLocalMedia(); setUploadedMedia([]); setType(nextType); setUploadProgress(0); setCaption(""); if (nextType === "STORY") { setCommentAutomationId(""); setCommentTriggerKeywords(""); setCommentTriggerResponse(""); } else { setStoryReplyAutomationId(""); setStoryReplyTriggerKeywords(""); setStoryReplyTriggerResponse(""); } }'
          if s.count(old_type) != 1:
              raise SystemExit(f'PublishingDashboard type handler replacement failed: {s.count(old_type)}')
          s = s.replace(old_type, new_type, 1)

          old_validation = 'if (storyReplyAutomationId && type !== "STORY") { setError("شرط Reply استوری فقط برای Story قابل استفاده است."); return; }'
          new_validation = 'if (storyReplyAutomationId && type !== "STORY") { setError("شرط Reply استوری فقط برای Story قابل استفاده است."); return; } if ((commentTriggerKeywords.trim() || commentTriggerResponse.trim()) && type === "STORY") { setError("شرط کامنت برای Story قابل استفاده نیست."); return; } if ((storyReplyTriggerKeywords.trim() || storyReplyTriggerResponse.trim()) && type !== "STORY") { setError("شرط Reply استوری فقط برای Story قابل استفاده است."); return; } if ((commentTriggerKeywords.trim() && !commentTriggerResponse.trim()) || (!commentTriggerKeywords.trim() && commentTriggerResponse.trim())) { setError("برای شرط کامنت، کلمات کلیدی و پاسخ را هر دو وارد کنید."); return; } if ((storyReplyTriggerKeywords.trim() && !storyReplyTriggerResponse.trim()) || (!storyReplyTriggerKeywords.trim() && storyReplyTriggerResponse.trim())) { setError("برای شرط Reply استوری، کلمات کلیدی و پاسخ را هر دو وارد کنید."); return; } if (commentAutomationId && commentTriggerKeywords.trim()) { setError("همزمان Automation کامنت و شرط سفارشی کامنت مجاز نیست."); return; } if (storyReplyAutomationId && storyReplyTriggerKeywords.trim()) { setError("همزمان Automation استوری و شرط سفارشی Reply مجاز نیست."); return; }'
          if s.count(old_validation) != 1:
              raise SystemExit(f'PublishingDashboard validation replacement failed: {s.count(old_validation)}')
          s = s.replace(old_validation, new_validation, 1)

          old_body = 'commentAutomationId: commentAutomationId || null, storyReplyAutomationId: storyReplyAutomationId || null, media: uploadedMedia'
          new_body = 'commentAutomationId: commentAutomationId || null, storyReplyAutomationId: storyReplyAutomationId || null, commentTriggerKeywords: commentTriggerKeywords.trim() || null, commentTriggerResponse: commentTriggerResponse.trim() || null, storyReplyTriggerKeywords: storyReplyTriggerKeywords.trim() || null, storyReplyTriggerResponse: storyReplyTriggerResponse.trim() || null, media: uploadedMedia'
          if s.count(old_body) != 1:
              raise SystemExit(f'PublishingDashboard request body replacement failed: {s.count(old_body)}')
          s = s.replace(old_body, new_body, 1)

          old_reset = 'setCaption(""); setUploadedMedia([]); setCommentAutomationId(""); setStoryReplyAutomationId(""); setUploadProgress(0); await loadJobs();'
          new_reset = 'setCaption(""); setUploadedMedia([]); setCommentAutomationId(""); setStoryReplyAutomationId(""); setCommentTriggerKeywords(""); setCommentTriggerResponse(""); setStoryReplyTriggerKeywords(""); setStoryReplyTriggerResponse(""); setUploadProgress(0); await loadJobs();'
          if s.count(old_reset) != 1:
              raise SystemExit(f'PublishingDashboard reset replacement failed: {s.count(old_reset)}')
          s = s.replace(old_reset, new_reset, 1)

          old_ui = '''<div className="mb-5 rounded-2xl border border-slate-200 bg-slate-50 p-4"><div className="mb-3"><span className="block text-sm font-medium text-slate-700">شرط اجرای Automation</span><span className="mt-1 block text-xs leading-5 text-slate-400">برای این محتوای منتشرشده، یک Automation فعال را انتخاب کنید تا بعد از انتشار به Media ID واقعی Instagram متصل شود.</span></div>{type !== "STORY" && <label className="mb-3 block"><span className="mb-2 block text-xs font-medium text-slate-600">کامنت شرطی</span><select value={commentAutomationId} onChange={(e) => setCommentAutomationId(e.target.value)} className="w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm"><option value="">بدون شرط کامنت</option>{commentAutomations.map((item) => <option key={item.id} value={item.id}>{item.keyword ? `کلمات: ${item.keyword}` : "Automation کامنت"}</option>)}</select></label>}{type === "STORY" && <label className="block"><span className="mb-2 block text-xs font-medium text-slate-600">Reply استوری شرطی</span><select value={storyReplyAutomationId} onChange={(e) => setStoryReplyAutomationId(e.target.value)} className="w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm"><option value="">بدون شرط Reply استوری</option>{storyAutomations.map((item) => <option key={item.id} value={item.id}>{item.keyword ? `کلمات: ${item.keyword}` : "Automation استوری"}</option>)}</select></label>}{((type !== "STORY" && commentAutomations.length === 0) || (type === "STORY" && storyAutomations.length === 0)) && <p className="mt-2 text-xs text-slate-400">برای این نوع شرط Automation فعالی برای این اکانت وجود ندارد.</p>}</div>'''
          # The source currently uses a compact block but variable names may be `automations`; handle both known variants.
          if old_ui in s:
              new_ui = '''<div className="mb-5 rounded-2xl border border-slate-200 bg-slate-50 p-4"><div className="mb-4"><span className="block text-sm font-medium text-slate-700">شرط اجرای Automation</span><span className="mt-1 block text-xs leading-5 text-slate-400">برای این محتوا می‌توانید کلمات کلیدی و پاسخ اختصاصی تعریف کنید. بعد از انتشار، شرط به Media ID واقعی Instagram متصل می‌شود.</span></div>{type !== "STORY" && <div className="space-y-3"><label className="block"><span className="mb-2 block text-xs font-medium text-slate-600">کلمات کلیدی کامنت</span><input value={commentTriggerKeywords} onChange={(e) => { setCommentTriggerKeywords(e.target.value); if (e.target.value.trim()) setCommentAutomationId(""); }} placeholder="مثلاً 1، یک، one" className="w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm outline-none focus:border-slate-400" /></label><label className="block"><span className="mb-2 block text-xs font-medium text-slate-600">پاسخ خودکار</span><textarea value={commentTriggerResponse} onChange={(e) => { setCommentTriggerResponse(e.target.value); if (e.target.value.trim()) setCommentAutomationId(""); }} rows={3} placeholder="متنی که در DM برای کاربر ارسال می‌شود" className="w-full resize-none rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm outline-none focus:border-slate-400" /></label><details className="rounded-xl border border-slate-200 bg-white p-3"><summary className="cursor-pointer text-xs font-medium text-slate-600">یا یک Automation موجود انتخاب کنید</summary><select value={commentAutomationId} onChange={(e) => { setCommentAutomationId(e.target.value); if (e.target.value) { setCommentTriggerKeywords(""); setCommentTriggerResponse(""); } }} className="mt-3 w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm"><option value="">بدون Automation موجود</option>{automations.filter((item) => item.triggerType === "COMMENT_KEYWORD" && item.isActive).map((item) => <option key={item.id} value={item.id}>{item.keyword ? `کلمات: ${item.keyword}` : "Automation کامنت"}</option>)}</select></details></div>}{type === "STORY" && <div className="space-y-3"><label className="block"><span className="mb-2 block text-xs font-medium text-slate-600">کلمات کلیدی Reply استوری</span><input value={storyReplyTriggerKeywords} onChange={(e) => { setStoryReplyTriggerKeywords(e.target.value); if (e.target.value.trim()) setStoryReplyAutomationId(""); }} placeholder="مثلاً 1، یک، one" className="w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm outline-none focus:border-slate-400" /></label><label className="block"><span className="mb-2 block text-xs font-medium text-slate-600">پاسخ خودکار</span><textarea value={storyReplyTriggerResponse} onChange={(e) => { setStoryReplyTriggerResponse(e.target.value); if (e.target.value.trim()) setStoryReplyAutomationId(""); }} rows={3} placeholder="متنی که برای Reply استوری ارسال می‌شود" className="w-full resize-none rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm outline-none focus:border-slate-400" /></label><details className="rounded-xl border border-slate-200 bg-white p-3"><summary className="cursor-pointer text-xs font-medium text-slate-600">یا یک Automation موجود انتخاب کنید</summary><select value={storyReplyAutomationId} onChange={(e) => { setStoryReplyAutomationId(e.target.value); if (e.target.value) { setStoryReplyTriggerKeywords(""); setStoryReplyTriggerResponse(""); } }} className="mt-3 w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm"><option value="">بدون Automation موجود</option>{automations.filter((item) => item.triggerType === "STORY_REPLY_KEYWORD" && item.isActive).map((item) => <option key={item.id} value={item.id}>{item.keyword ? `کلمات: ${item.keyword}` : "Automation استوری"}</option>)}</select></details></div>}</div>'''
              s = s.replace(old_ui, new_ui, 1)
          else:
              # Use a regex fallback bounded by the known heading.
              pattern = re.compile(r'<div className="mb-5 rounded-2xl border border-slate-200 bg-slate-50 p-4"><div className="mb-3"><span className="block text-sm font-medium text-slate-700">شرط اجرای Automation</span>.*?</div>', re.S)
              if not pattern.search(s):
                  raise SystemExit('PublishingDashboard automation UI block not found')
              raise SystemExit('PublishingDashboard automation UI block format differs; refusing unsafe patch')

          p.write_text(s, encoding='utf-8')
          print('UI patches applied successfully')
          PY

      - name: Typecheck changed files with formatting sanity
        run: |
          git diff --check
          git diff -- components/dashboard/AutomationForm.tsx components/dashboard/publishing/PublishingDashboard.tsx

      - name: Commit and cleanup workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/dashboard/AutomationForm.tsx components/dashboard/publishing/PublishingDashboard.tsx
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "feat: add multi-keyword and custom publishing triggers"
          rm -f .github/workflows/apply-publishing-ui.yml
          git add .github/workflows/apply-publishing-ui.yml
          git diff --cached --quiet || git commit -m "chore: remove temporary UI patch workflow"
          git push origin HEAD:master
